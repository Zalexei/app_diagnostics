name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Dart (Flutter ${{ matrix.flutter || 'stable' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Flutter and the latest stable.
        flutter: ['3.35.0', '']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run

  android:
    name: Android build and Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter build apk --debug
        working-directory: example
      - run: ./gradlew :app_diagnostics:testDebugUnitTest
        working-directory: example/android
